name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firebase/functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: firebase/functions/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - run: npm install -g firebase-tools@14
      - run: npm run build
      - name: Güvenlik kuralları ve fonksiyon testleri (emülatör)
        run: firebase emulators:exec --only auth,firestore,functions --project demo-murevet "npx jest --runInBand"
